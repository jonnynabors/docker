name: homelab

x-common: &common
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

x-lsio-env: &lsio-env
  PUID: "1000"
  PGID: "1000"
  TZ: America/Chicago

# Joins gluetun's network namespace; restarts with it so the shared network never goes stale.
x-via-gluetun: &via-gluetun
  <<: *common
  network_mode: service:gluetun
  depends_on:
    gluetun:
      condition: service_healthy
      restart: true

services:
  # --- DNS + reverse proxy ---
  pihole:
    <<: *common
    image: pihole/pihole:2026.11.0
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: America/Chicago
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set in .env}
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d

  caddy:
    <<: *common
    build: ./caddy
    image: homelab/caddy-cloudflare:2.11.7
    container_name: caddy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/caddy_data:/data
      - ./caddy/caddy_config:/config

  # --- VPN gateway: everything below with network_mode service:gluetun goes through Mullvad ---
  gluetun:
    <<: *common
    image: qmcgaw/gluetun:latest@sha256:6d21823e204e99adbb0aa811105504514d16150cc5299f443f191c28792fcf4b
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8096:8096"  # Jellyfin
      - "8112:8112"  # qBittorrent
      - "7878:7878"  # Radarr
      - "8989:8989"  # Sonarr
      - "9696:9696"  # Prowlarr
      - "6767:6767"  # Bazarr
    environment:
      TZ: America/Chicago
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?set in .env}
      SERVER_COUNTRIES: USA
      SERVER_CITIES: Dallas TX
      DNS_ADDRESS: 127.0.0.11
      FIREWALL_OUTBOUND_SUBNETS: 172.16.0.0/12,192.168.68.0/24
      BLOCK_MALICIOUS: "off"

  qbittorrent:
    <<: *via-gluetun
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8112/"]
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8112"
    volumes:
      - ./media-stack/torrent:/config
      - ${MEDIA_ROOT:-/mnt/storage}/downloads:/downloads

  prowlarr:
    <<: *via-gluetun
    image: lscr.io/linuxserver/prowlarr:2.7.0
    container_name: prowlarr
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
    environment: *lsio-env
    volumes:
      - ./media-stack/prowlarr:/config

  # Cloudflare solver; in the VPN netns so cookies match Prowlarr's egress IP.
  # Prowlarr proxy URL: http://localhost:8191
  flaresolverr:
    <<: *via-gluetun
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      TZ: America/Chicago
      LOG_LEVEL: info
    tmpfs:
      - /tmp:size=256M,mode=1777

  radarr:
    <<: *via-gluetun
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
    environment: *lsio-env
    volumes:
      - ./media-stack/radarr:/config
      - ${MEDIA_ROOT:-/mnt/storage}:/media
      - ${MEDIA_ROOT:-/mnt/storage}/downloads:/downloads

  sonarr:
    <<: *via-gluetun
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
    environment: *lsio-env
    volumes:
      - ./media-stack/sonarr:/config
      - ${MEDIA_ROOT:-/mnt/storage}:/media
      - ${MEDIA_ROOT:-/mnt/storage}/downloads:/downloads

  jellyfin:
    <<: *via-gluetun
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
    environment: *lsio-env
    volumes:
      - ./media-stack/jellyfin:/config
      - ${MEDIA_ROOT:-/mnt/storage}:/media
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  bazarr:
    <<: *via-gluetun
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/"]
    environment: *lsio-env
    volumes:
      - ./media-stack/bazarr:/config
      - ${MEDIA_ROOT:-/mnt/storage}:/media

  # --- Outside the VPN ---
  # Runs as uid 1000, so media-stack/seerr must be owned by 1000:1000
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    init: true
    environment:
      TZ: America/Chicago
      PORT: "5055"
    volumes:
      - ./media-stack/seerr:/app/config
    ports:
      - "5055:5055"

  # Served at tv.rackcellar.com via Caddy; Jellyfin uses http://tunarr:8000.
  tunarr:
    <<: *common
    image: chrisbenincasa/tunarr:2026.10.3
    container_name: tunarr
    environment:
      TZ: America/Chicago
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./media-stack/tunarr:/config/tunarr
      - ${MEDIA_ROOT:-/mnt/storage}:/media:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vaultwarden:
    <<: *common
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden
    environment:
      TZ: America/Chicago
      DOMAIN: https://vault.rackcellar.com
      # Set true in .env only long enough to create your account
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
    volumes:
      - ./vaultwarden/data:/data

  # Daily consistent SQLite snapshot, 30 days retained. Needs rw on /data for WAL.
  vaultwarden-backup:
    <<: *common
    image: alpine:3.24
    container_name: vaultwarden-backup
    depends_on:
      - vaultwarden
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          sqlite3 /data/db.sqlite3 ".backup '/backups/db-$$(date +%F).sqlite3'"
          find /backups -name 'db-*.sqlite3' -mtime +30 -delete
          sleep 86400
        done
    volumes:
      - ./vaultwarden/data:/data
      - ${VAULTWARDEN_BACKUP_DIR:-./vaultwarden/backups}:/backups

  # Local LLM. No host port; Open WebUI reaches it at http://ollama:11434.
  # Pull models with: docker compose exec ollama ollama pull <model>
  ollama:
    <<: *common
    image: ollama/ollama:0.40.17
    container_name: ollama
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "ollama", "list"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Free VRAM for Jellyfin/Tunarr transcodes when idle; one model at a time (8GB card).
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Served at ai.rackcellar.com via Caddy. Chat history, assistants and knowledge live in ./open-webui.
  open-webui:
    <<: *common
    image: ghcr.io/open-webui/open-webui:v0.13.4
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_healthy
    # Host has 8GB RAM shared with the whole stack.
    mem_limit: 2g
    environment:
      TZ: America/Chicago
      OLLAMA_BASE_URL: http://ollama:11434
      # Embeddings run on Ollama (GPU) instead of in this container's RAM.
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      # Set true in .env only long enough to create your account
      ENABLE_SIGNUP: ${OPENWEBUI_SIGNUPS_ALLOWED:-false}
    volumes:
      - ./open-webui:/app/backend/data
